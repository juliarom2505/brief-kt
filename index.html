<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бриф на карточку товара</title>
<style>
:root{
  /* нейтральная палитра */
  --ink:#333333; --deep:#3B3B3B; --steel:#8A8A8A; --muted:#7A7A7A;
  --mist:#F0F0F0; --fog:#F2F2F2; --rule:#CFCFCF; --paper:#fff;
  --y:#4A4A4A; --y-line:#9C9C9C; --y-hover:#383838; --y-soft:#E9E9E7; --y-bg:#F7F7F5;
  --link:#2F5E9E; --red:#C4262E; --red-d:#A51F27; --red-soft:#FBECEC;
  --req:var(--y-bg); --ok:#4E9A3E; --ok-bg:#E6F2E1; --err:#B03A2E; --err-bg:#FBECEA;
  --r:6px;
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--fog);color:var(--ink);
  font:15px/1.5 "Segoe UI","SF Pro Text",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

/* шапка */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:700;color:var(--deep);flex:1;min-width:240px;letter-spacing:-.01em}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:9px 16px;font-weight:600;font-size:14px;color:var(--deep)}
.btn:hover{border-color:var(--steel)}
.btn.main{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.main:hover{background:#1b3549}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}
.btn.quiet:hover{color:var(--deep)}

/* панель SKU */
.skubar{max-width:1080px;margin:0 auto;padding:0 24px 12px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px;max-width:240px}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#C7D0D8;flex:none}
.chip.done .dot{background:var(--ok)}
.chip .x{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%;line-height:1;font-size:16px;padding:0}
.chip .x:hover{background:var(--mist);color:var(--err)}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.chip.on .x{color:#B9C9D6}.chip.on .x:hover{background:rgba(255,255,255,.12);color:#fff}
.chip.on .dot{background:#9FB3C3}.chip.on.done .dot{background:#8FD0B0}
.chip:not(.on){cursor:pointer}
.add{flex:none;border:1px dashed #AFC0CD;background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--deep);font-weight:600}
.add:hover{border-style:solid;background:var(--paper)}
.add[disabled]{opacity:.45;cursor:not-allowed}
.skucount{flex:none;margin-left:auto;font-size:13px;color:var(--muted);padding-left:8px}

main{max-width:1080px;margin:0 auto;padding:24px 24px 80px}

/* заявка */
.request{background:var(--req);border-left:4px solid var(--deep);border-radius:var(--r);padding:20px 22px 22px;margin-bottom:32px}
.request h2{margin:0 0 14px;font-size:17px;color:var(--deep)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
.rgrid .wide{grid-column:1/-1}

/* разделы */
.sec{margin-bottom:36px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--deep);padding-bottom:8px;margin-bottom:18px}
.sec-h h2{margin:0;font-size:19px;color:var(--deep)}
.sec-h .note{color:var(--muted);font-style:italic;font-size:14px}
.sec-h .prog{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-h .prog b{color:var(--deep)}
.sku-title{font-size:13px;color:var(--muted);margin:-8px 0 14px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.f{min-width:0;display:flex;flex-direction:column}
.f.wide{grid-column:1/-1}
.lbl{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink)}
.lbl .opt{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:9px 11px;font-size:15px;transition:border-color .12s}
input::placeholder,textarea::placeholder{color:#9AA7B2;font-style:italic}
input:hover,select:hover,textarea:hover{border-color:#B8C4CE}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(79,107,128,.15)}
textarea{min-height:88px;resize:vertical;line-height:1.45}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--steel) 50%),linear-gradient(135deg,var(--steel) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select:invalid,select.empty{color:#9AA7B2;font-style:italic}
.request input,.request textarea{border-color:#B5C6D3}

/* да/нет */
.yn{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--paper);align-self:flex-start}
.yn button{border:0;background:transparent;padding:8px 22px;font-size:14px;color:var(--ink)}
.yn button+button{border-left:1px solid var(--rule)}
.yn button.on{background:var(--deep);color:#fff}
.yn .exv{padding:8px 12px;font-size:13px;color:#9AA7B2;font-style:italic;border-left:1px solid var(--rule)}

/* подсказка */
.tip{position:relative;display:inline-flex}
.tip button{width:18px;height:18px;border-radius:50%;border:1px solid #AFC0CD;background:var(--paper);color:var(--steel);font-size:11px;font-weight:700;line-height:1;padding:0}
.tip .bub{position:absolute;left:-8px;bottom:calc(100% + 8px);width:300px;max-width:72vw;background:var(--deep);color:#fff;font-weight:400;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:6px;display:none;z-index:20;box-shadow:0 6px 18px rgba(29,43,54,.18)}
.tip .bub::after{content:"";position:absolute;left:12px;top:100%;border:6px solid transparent;border-top-color:var(--deep)}
.tip:hover .bub,.tip:focus-within .bub{display:block}

/* группы размеров */
.dims{grid-column:1/-1;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);padding:14px 16px 16px}
.dims h3{margin:0 0 10px;font-size:14px;color:var(--deep)}
.dims .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.dims .lbl{font-weight:500;font-size:13px;color:var(--muted)}

.msg{font-size:12.5px;color:var(--err);margin-top:4px;min-height:0}
.bad input,.bad textarea,.bad select,.bad .yn{border-color:var(--err);background:var(--err-bg)}
.miss input,.miss textarea,.miss select,.miss .yn{border-color:#D9A79E}

/* модалка и тост */
.ov{position:fixed;inset:0;background:rgba(29,43,54,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.ov.show{display:flex}
.modal{background:var(--paper);border-radius:10px;max-width:540px;width:100%;max-height:84vh;overflow:auto;padding:22px 24px}
.modal h3{margin:0 0 8px;font-size:17px;color:var(--deep)}
.modal p{margin:0 0 10px;color:var(--muted);font-size:14px}
.modal .grp{margin:10px 0}
.modal .grp b{font-size:14px}
.modal ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.modal li a{color:var(--steel);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:var(--deep);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.18s;pointer-events:none;z-index:70}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}

@media (max-width:820px){
  .top{position:static}html{scroll-padding-top:16px}
  .top-in{gap:8px}.top-in .btn.main{margin-left:auto}
  .tip .bub{width:240px}
  .top-in{padding:12px 16px}.skubar{padding:0 16px 10px}main{padding:18px 16px 60px}
  .grid,.rgrid{grid-template-columns:1fr}
  .dims .row{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- акценты (красный — в духе nle.ru) ---- */
.tip button:hover{border-color:var(--red);color:var(--red)}
.sec-h .prog b{color:var(--red)}
.top{border-top:3px solid var(--red);border-bottom-color:#DADADA}
.btn.main{background:var(--red);border-color:var(--red);color:#fff}
.btn.main:hover{background:var(--red-d)!important;border-color:var(--red-d)}
.btn.main:hover{background:var(--y-hover)}
.btn:hover{border-color:var(--y-line)}
.chip.on{background:#fff;border:1.5px solid var(--red);color:#222;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip.on .x{color:#777}.chip.on .x:hover{background:rgba(0,0,0,.06);color:var(--err)}
.chip.on .dot{background:#A8A8A8}.chip.on.done .dot,.chip.done .dot{background:var(--ok)}
.chip .dot{background:#C8C8C8}
.add{border-color:#C9C9C9;color:#444}
.add:hover{border-color:var(--red);color:var(--red);background:#fff}
.request{background:var(--y-bg);border:1px solid #E2E2DF;border-left:4px solid var(--red)}
.request input,.request textarea{border-color:#CDCDCA}
.sec-h{border-bottom:2px solid var(--red)}
input:hover,select:hover,textarea:hover{border-color:#B0B0B0}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(196,38,46,.12)}
input::placeholder,textarea::placeholder,select.empty{color:#A6A6A6}
.yn button.on{background:var(--y);color:#fff}
.tip button{border-color:#BDBDBD;color:#777}
.tip .bub{background:#FAFAF8;color:#333;border:1px solid #C4C4C0;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.tip .bub::after{border-top-color:#C4C4C0}
.modal li a{color:var(--link)}
.ov{background:rgba(40,40,40,.4)}
.toast{background:#3B3B3B}
:focus-visible{outline-color:var(--red)}
select{background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%)}

/* подсказка у кнопки «Скачать Excel» */
.dl{position:relative;display:inline-flex}
.dl .bub{position:absolute;right:0;top:calc(100% + 10px);width:290px;background:#FAFAF8;color:#333;border:1px solid #C4C4C0;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 3px 10px rgba(0,0,0,.12);display:none;z-index:40}
.dl .bub::before{content:"";position:absolute;right:22px;bottom:100%;border:6px solid transparent;border-bottom-color:#C4C4C0}
.dl:hover .bub,.dl:focus-within .bub{display:block}
@media (max-width:820px){.dl .bub{right:auto;left:0}.dl .bub::before{right:auto;left:22px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>Бриф на заведение карточки товара в 1С</h1>
    <button class="btn quiet" id="bOpen" title="Загрузите ранее заполненный бриф из Excel, чтобы внести корректировки">Экспортировать бриф</button>
    <button class="btn quiet" id="bClear">Очистить</button>
    <span class="dl"><button class="btn main" id="bExcel" aria-describedby="dlTip">Скачать Excel</button>
      <span class="bub" id="dlTip" role="tooltip">Скачайте заполненный бриф и отправьте файл менеджеру по сопровождению — он заведёт карточку товара в 1С.</span></span>
    <input type="file" id="fOpen" accept=".xlsx" class="hidden">
  </div>
  <div class="skubar" id="skubar"></div>
</header>

<main>
  <section class="request" aria-labelledby="hReq">
    <h2 id="hReq">Заявка</h2>
    <div class="rgrid" id="req"></div>
  </section>
  <div id="form"></div>
</main>

<div class="ov" id="ov"><div class="modal" id="mod" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

q"}, {"id": "X", "label": "Ссылка на сертификат или скан РД", "row": 36, "hint": "Ссылка на запись в реестре (например, pub.fsa.gov.ru). Если есть только скан — напишите «Скан».", "ex": "https://pub.fsa.gov.ru/rss/certificate/view/3730617", "chk": null, "sec": "req"}, {"id": "Y", "label": "Необходимость выгрузки в ИМ NLE", "row": 39, "hint": null, "ex": "да", "chk": "yn", "sec": "add"}, {"id": "Z", "label": "Единица измерения (индивидуальная упаковка)", "row": 40, "hint": null, "ex": "шт", "chk": "unit", "sec": "add"}, {"id": "AA", "label": "Единица измерения (групповая упаковка)", "row": 41, "hint": "Заполняется, если товар поставляется в коробах.", "ex": "", "chk": "unit", "sec": "add"}, {"id": "AB", "label": "Код EAN (индивидуальная упаковка)", "row": 42, "hint": "Штрихкод, 13 цифр. Берём у поставщика; для новых комплектов запрашиваем присвоение EAN.", "ex": "4630640807767", "chk": "ean", "sec": "add"}, {"id": "AC", "label": "Код EAN (групповая упаковка)", "row": 43, "hint": "Штрихкод короба. Заполняется, если товар поставляется в коробах.", "ex": "", "chk": "ean", "sec": "add"}, {"id": "AD", "label": "Индивидуальная упаковка: длина, мм", "row": 44, "hint": null, "ex": 600, "chk": "int", "sec": "add"}, {"id": "AE", "label": "Индивидуальная упаковка: ширина, мм", "row": 45, "hint": null, "ex": 575, "chk": "int", "sec": "add"}, {"id": "AF", "label": "Индивидуальная упаковка: высота, мм", "row": 46, "hint": null, "ex": 150, "chk": "int", "sec": "add"}, {"id": "AG", "label": "Индивидуальная упаковка: вес брутто, кг", "row": 47, "hint": "Вес вместе с упаковкой.", "ex": 6.3, "chk": "dec", "sec": "add"}, {"id": "AH", "label": "Индивидуальная упаковка: вес нетто, кг", "row": 48, "hint": "Вес без упаковки.", "ex": 5.67, "chk": "dec", "sec": "add"}, {"id": "AI", "label": "Групповая упаковка: длина, мм", "row": 49, "hint": null, "ex": "", "chk": "int", "sec": "add"}, {"id": "AJ", "label": "Групповая упаковка: ширина, мм", "row": 50, "hint": null, "ex": "", "chk": "int", "sec": "add"}, {"id": "AK", "label": "Групповая упаковка: высота, мм", "row": 51, "hint": null, "ex": "", "chk": "int", "sec": "add"}, {"id": "AL", "label": "Групповая упаковка: вес брутто, кг", "row": 52, "hint": null, "ex": "", "chk": "dec", "sec": "add"}, {"id": "AM", "label": "Групповая упаковка: вес нетто, кг", "row": 53, "hint": null, "ex": "", "chk": "dec", "sec": "add"}, {"id": "AN", "label": "Кратность упаковки, шт.", "row": 54, "hint": "Сколько единиц товара в одном коробе.", "ex": "", "chk": "int", "sec": "add"}, {"id": "AO", "label": "Код ТН ВЭД", "row": 55, "hint": "Таможенный код, 10 цифр. Есть в декларации или у поставщика.", "ex": "8528711900", "chk": "tnved", "sec": "add"}, {"id": "AP", "label": "Код ОКПД", "row": 56, "hint": "Код из классификатора продукции. Есть в сертификате или декларации.", "ex": "26.40.20.110", "chk": "text", "sec": "add"}, {"id": "AQ", "label": "Статус в ассортиментной матрице", "row": 57, "hint": null, "ex": "Новинка", "chk": "status", "sec": "add"}, {"id": "AR", "label": "Аналог", "row": 58, "hint": "Если в 1С есть похожий товар — укажите его артикул или название.", "ex": "TV IP-set-top 2", "chk": null, "sec": "add"}, {"id": "AS", "label": "Фото", "row": 59, "hint": "Ссылка на папку с фото. Для интернет-магазина фото нумеруются в том порядке, в каком они будут на сайте.", "ex": "\\\\server\\Фото\\Стандарт2", "chk": null, "sec": "add"}, {"id": "AT", "label": "РП", "row": 60, "hint": "Указать ссылку на папку.", "ex": "\\\\server\\РП\\Стандарт2", "chk": null, "sec": "add"}, {"id": "AU", "label": "Дополнительная информация", "row": 61, "hint": null, "ex": "", "chk": null, "sec": "add"}, {"id": "AV", "label": "Гарантийный срок", "row": 62, "hint": null, "ex": "12 мес.", "chk": null, "sec": "add"}, {"id": "AW", "label": "Срок годности", "row": 63, "hint": null, "ex": "не установлен", "chk": null, "sec": "add"}, {"id": "AX", "label": "Срок службы", "row": 64, "hint": null, "ex": "5 лет", "chk": null, "sec": "add"}], "req": [{"id": "date", "label": "Дата заявки", "cell": "B6"}, {"id": "deadline", "label": "Дата выполнения (дедлайн)", "cell": "B7"}, {"id": "pm", "label": "Ответственный менеджер по продукту", "cell": "B8"}, {"id": "fix", "label": "Корректировка данных (в случае повторной отправки брифа)", "cell": "B9"}]};
const MAXSKU = 20;
const SKUCOLS = Array.from({length:MAXSKU},(_,i)=>colName(3+i)); // C..V
const LISTS = {yn:["да","нет"], vat:["Без НДС","0%","5%","7%","10%","18%","20%","22%","22/122%"],
  unit:["шт","м","км","бухта","упак"], status:["Новинка","Под заказ","Комплектующие"]};
const WIDE = new Set(["B","C","N","O","X","AS","AT","AU"]);
const AREA = new Set(["N","O","AU"]);
const DIMS = {AD:["Индивидуальная упаковка",["AD","AE","AF","AG","AH"]], AI:["Групповая упаковка",["AI","AJ","AK","AL","AM"]]};
const DIMIN = {}; Object.values(DIMS).forEach(([,ids])=>ids.forEach(i=>DIMIN[i]=1));
const OPTIONAL = new Set(["K","L","M"]);           // только для одежды/обуви
const COND = {T:s=>s.S==="да",U:s=>s.S==="да",V:s=>s.S==="да",X:s=>s.W==="да"};
const FB = {}; CFG.fields.forEach(f=>FB[f.id]=f);

function colName(n){let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
const $=q=>document.querySelector(q);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- состояние ---------- */
const KEY="brief_kt_form_v2";
const todayISO=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function blank(){return {req:{date:todayISO()},skus:[{}],cur:0,touched:{}};}
let S=blank();
try{const o=JSON.parse(localStorage.getItem(KEY)||"null"); if(o&&o.skus&&o.skus.length){S=Object.assign(blank(),o);S.cur=Math.min(S.cur||0,S.skus.length-1);S.touched={};}}catch(e){}
let tSave; function save(){clearTimeout(tSave);tSave=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({req:S.req,skus:S.skus,cur:S.cur}))}catch(e){}},200);}
const sku=()=>S.skus[S.cur];

/* ---------- проверки ---------- */
const isEmpty=v=>v==null||String(v).trim()==="";
const toNum=v=>Number(String(v).replace(/\s/g,"").replace(",","."));
function required(f,s){
  if(f.sec!=="req"||OPTIONAL.has(f.id)) return false;
  if(COND[f.id]) return COND[f.id](s);
  return true;
}
function fmtError(f,v){
  if(isEmpty(v)) return "";
  const t=String(v).trim();
  switch(f.chk){
    case "ean": if(!/^\d+$/.test(t)) return "Только цифры"; if(![8,13,14].includes(t.length)) return "Нужно 8, 13 или 14 цифр"; break;
    case "tnved": if(!/^\d{10}$/.test(t)) return "Нужно ровно 10 цифр"; break;
    case "int": { const n=toNum(t); if(!Number.isInteger(n)||n<=0) return "Целое число больше 0, без единиц"; break; }
    case "dec": { const n=toNum(t); if(!(n>0)) return "Число больше 0, например 6,3"; break; }
  }
  return "";
}
function skuStats(s){
  let tot=0,ok=0,addTot=0,addOk=0; const miss=[], bad=[];
  CFG.fields.forEach(f=>{
    const v=s[f.id], e=fmtError(f,v);
    if(e) bad.push({f,e});
    if(f.sec==="req"){ if(required(f,s)){ tot++; if(!isEmpty(v)&&!e) ok++; else if(isEmpty(v)) miss.push(f);} }
    else { addTot++; if(!isEmpty(v)&&!e) addOk++; }
  });
  return {tot,ok,addTot,addOk,miss,bad,done:tot===ok&&!bad.length};
}
const skuName=(s,i)=> (s.D&&s.D.trim()) || (s.C&&s.C.trim()) || `SKU ${i+1}`;

/* ---------- рендер ---------- */
function tipHtml(t){ return t?`<span class="tip"><button type="button" aria-label="Подсказка">?</button><span class="bub" role="tooltip">${esc(t)}</span></span>`:""; }
function exText(f){ return f.ex===""||f.ex==null?"":"Например: "+String(f.ex).split("\n")[0]+(String(f.ex).includes("\n")?"…":""); }
function control(f,v){
  const d=`data-id="${f.id}"`;
  if(f.chk==="yn") return `<div class="yn" ${d} role="group" aria-label="${esc(f.label)}">${LISTS.yn.map(o=>`<button type="button" data-v="${o}" class="${v===o?"on":""}" aria-pressed="${v===o}">${o==="да"?"Да":"Нет"}</button>`).join("")}</div>`;
  if(LISTS[f.chk]) return `<select ${d} class="${isEmpty(v)?"empty":""}"><option value="">${esc(f.ex?("Например: "+f.ex):"Выберите")}</option>${LISTS[f.chk].map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select>`;
  if(AREA.has(f.id)) return `<textarea ${d} placeholder="${esc(f.ex||"")}">${esc(v)}</textarea>`;
  const im=["ean","tnved","int"].includes(f.chk)?"numeric":f.chk==="dec"?"decimal":"text";
  return `<input type="text" inputmode="${im}" ${d} value="${esc(v)}" placeholder="${esc(exText(f))}">`;
}
function fieldHtml(f,s,compact){
  const optional = f.sec==="req" && OPTIONAL.has(f.id) ? ` <span class="opt">для одежды и обуви</span>` : COND[f.id] ? ` <span class="opt">${f.id==="X"?"если сертификация — да":"если бренд Триколор"}</span>` : "";
  const label = compact ? f.label.replace(/^.*упаковка:\s*/,"").replace(/^./,c=>c.toUpperCase()) : f.label;
  return `<div class="f${WIDE.has(f.id)?" wide":""}" data-wrap="${f.id}">
    <label class="lbl" ${f.chk==="yn"?"":`for="in_${f.id}"`}>${esc(label)}${optional}${tipHtml(f.hint)}</label>
    ${control(f,s[f.id]).replace(`data-id="${f.id}"`,`data-id="${f.id}" id="in_${f.id}"`)}
    <div class="msg"></div></div>`;
}
function renderReq(){
  const R=S.req;
  $("#req").innerHTML=CFG.req.map(q=>{
    const t=q.id==="date"||q.id==="deadline"?"date":"text";
    const wide=q.id==="fix";
    const ctrl= wide?`<textarea id="rq_${q.id}" data-req="${q.id}" placeholder="Заполняется при повторной отправке: что изменилось">${esc(R[q.id])}</textarea>`
      :`<input type="${t}" id="rq_${q.id}" data-req="${q.id}" value="${esc(R[q.id])}"${q.id==="pm"?' placeholder="Фамилия И.О."':""}>`;
    return `<div class="f${wide?" wide":""}"><label class="lbl" for="rq_${q.id}">${esc(q.label)}</label>${ctrl}</div>`;
  }).join("");
}
function renderSkubar(){
  $("#skubar").innerHTML=S.skus.map((s,i)=>{
    const st=skuStats(s);
    return `<div class="chip${i===S.cur?" on":""}${st.done?" done":""}" data-sku="${i}" role="tab" tabindex="0" aria-selected="${i===S.cur}" title="${esc(skuName(s,i))}">
      <span class="dot" aria-hidden="true"></span><span class="nm">${esc(skuName(s,i))}</span>
      ${S.skus.length>1?`<button type="button" class="x" data-del="${i}" aria-label="Удалить ${esc(skuName(s,i))}">×</button>`:""}</div>`;
  }).join("")+
  `<button type="button" class="add" id="addNew"${S.skus.length>=MAXSKU?" disabled":""}>+ Новый SKU</button>
   <button type="button" class="add" id="addCopy"${S.skus.length>=MAXSKU?" disabled":""} title="Новый SKU с данными текущего — останется поменять отличия">Дублировать текущий</button>
   <span class="skucount">${S.skus.length} из ${MAXSKU}</span>`;
}
function renderForm(){
  const s=sku(); let h="";
  [["req","Обязательные данные","без них карточку в 1С не завести"],["add","Дополнительные данные","нужны, чтобы товар можно было продавать"]].forEach(([sec,title,note])=>{
    h+=`<section class="sec"><div class="sec-h"><h2>${title}</h2><span class="note">${note}</span><span class="prog" data-prog="${sec}"></span></div>`;
    h+=`<div class="sku-title">${S.skus.length>1?`Заполняете: <b>${esc(skuName(s,S.cur))}</b>`:""}</div><div class="grid">`;
    CFG.fields.filter(f=>f.sec===sec).forEach(f=>{
      if(DIMS[f.id]){ const [t,ids]=DIMS[f.id];
        h+=`<div class="dims"><h3>${t}</h3><div class="row">${ids.map(i=>fieldHtml(FB[i],s,true)).join("")}</div></div>`; return; }
      if(DIMIN[f.id]) return;
      h+=fieldHtml(f,s,false);
    });
    h+=`</div></section>`;
  });
  $("#form").innerHTML=h;
  refresh();
}
function refresh(){
  const s=sku(), st=skuStats(s);
  CFG.fields.forEach(f=>{
    const w=document.querySelector(`[data-wrap="${f.id}"]`); if(!w) return;
    const e=fmtError(f,s[f.id]), t=S.touched[f.id]||S.showAll;
    w.classList.toggle("bad",!!e&&!!t);
    w.classList.toggle("miss",!e&&!!S.showAll&&required(f,s)&&isEmpty(s[f.id]));
    w.querySelector(".msg").textContent=(e&&t)?e:"";
    const sel=w.querySelector("select"); if(sel) sel.classList.toggle("empty",isEmpty(s[f.id]));
  });
  const p1=document.querySelector('[data-prog="req"]'), p2=document.querySelector('[data-prog="add"]');
  if(p1) p1.innerHTML=`заполнено <b>${st.ok}</b> из ${st.tot}`;
  if(p2) p2.innerHTML=`заполнено <b>${st.addOk}</b> из ${st.addTot}`;
  updateSkubar();
  save();
}
function updateSkubar(){
  const chips=document.querySelectorAll(".chip[data-sku]");
  if(chips.length!==S.skus.length){ renderSkubar(); return; }
  chips.forEach((c,i)=>{ const s=S.skus[i], n=skuName(s,i);
    c.classList.toggle("on",i===S.cur); c.classList.toggle("done",skuStats(s).done);
    c.setAttribute("aria-selected",i===S.cur); c.title=n;
    const nm=c.querySelector(".nm"); if(nm.textContent!==n) nm.textContent=n; });
}
function renderAll(){ renderReq(); renderSkubar(); renderForm(); }

/* ---------- события ---------- */
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.req){ S.req[el.dataset.req]=el.value; save(); return; }
  if(el.dataset.id){ sku()[el.dataset.id]=el.value; refresh(); }
});
document.addEventListener("focusout",e=>{ const id=e.target.dataset&&e.target.dataset.id; if(id){S.touched[id]=true;refresh();} });
document.addEventListener("click",e=>{
  const yb=e.target.closest(".yn button");
  if(yb){ const id=yb.parentNode.dataset.id; const v=sku()[id]===yb.dataset.v?"":yb.dataset.v; sku()[id]=v;
    yb.parentNode.querySelectorAll("button").forEach(b=>{const on=b.dataset.v===v;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);}); refresh(); return; }
  const del=e.target.closest("[data-del]");
  if(del){ e.stopPropagation(); const i=+del.dataset.del;
    ask(`Удалить ${esc(skuName(S.skus[i],i))}?`,"Данные этого SKU будут удалены из брифа.","Удалить",()=>{ S.skus.splice(i,1); S.cur=Math.max(0,Math.min(S.cur,S.skus.length-1)); S.touched={}; renderSkubar(); renderForm(); }); return; }
  const chip=e.target.closest(".chip[data-sku]");
  if(chip){ S.cur=+chip.dataset.sku; S.touched={}; renderForm(); return; }
  if(e.target.id==="addNew"||e.target.id==="addCopy"){
    if(S.skus.length>=MAXSKU) return;
    const copy=e.target.id==="addCopy"; const n=copy?Object.assign({},sku()):{};
    if(copy){ ["D","AB","AC"].forEach(k=>delete n[k]); }
    S.skus.push(n); S.cur=S.skus.length-1; S.touched={}; renderSkubar(); renderForm();
    toast(copy?"SKU скопирован. Укажите артикул, EAN и то, что отличается":"Добавлен новый SKU");
    const first=document.getElementById(copy?"in_D":"in_B"); if(first) first.focus();
  }
});
document.addEventListener("keydown",e=>{ const c=e.target.closest&&e.target.closest(".chip[data-sku]"); if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();c.click();} if(e.key==="Escape") close(); });

/* ---------- модалка ---------- */
const ov=$("#ov"), mod=$("#mod");
function close(){ ov.classList.remove("show"); }
ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
function ask(title,text,ok,fn){
  mod.innerHTML=`<h3>${title}</h3><p>${text}</p><div class="acts"><button class="btn" id="mN">Отмена</button><button class="btn main" id="mY">${ok}</button></div>`;
  ov.classList.add("show"); $("#mY").focus();
  $("#mN").onclick=close; $("#mY").onclick=()=>{close();fn();};
}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2600); }

/* ---------- Excel ---------- */
$("#bExcel").onclick=()=>{
  const groups=[];
  S.skus.forEach((s,i)=>{ const st=skuStats(s); if(st.miss.length||st.bad.length) groups.push({i,s,st}); });
  const reqMiss=["date","deadline","pm"].filter(k=>isEmpty(S.req[k]));
  if(!groups.length&&!reqMiss.length){ build(); return; }
  S.showAll=true; refresh();
  let h=`<h3>Бриф заполнен не полностью</h3><p>Без обязательных данных менеджер не сможет завести карточку. Нажмите на поле, чтобы перейти к нему.</p>`;
  if(reqMiss.length) h+=`<div class="grp"><b>Заявка</b><ul>${reqMiss.map(k=>`<li><a data-rq="${k}">${esc(CFG.req.find(q=>q.id===k).label)}</a></li>`).join("")}</ul></div>`;
  groups.forEach(g=>{
    const items=g.st.bad.map(x=>({f:x.f,t:x.e})).concat(g.st.miss.map(f=>({f,t:"не заполнено"})));
    h+=`<div class="grp"><b>${esc(skuName(g.s,g.i))}</b><ul>${items.map(x=>`<li><a data-go="${g.i}:${x.f.id}">${esc(x.f.label)}</a> — ${x.t}</li>`).join("")}</ul></div>`;
  });
  h+=`<div class="acts"><button class="btn" id="mN">Дозаполнить</button><button class="btn main" id="mY">Всё равно скачать</button></div>`;
  mod.innerHTML=h; ov.classList.add("show");
  $("#mN").onclick=close; $("#mY").onclick=()=>{close();build();};
  mod.querySelectorAll("[data-go]").forEach(a=>a.onclick=()=>{ const [i,id]=a.dataset.go.split(":"); close();
    if(+i!==S.cur){S.cur=+i;renderForm();} S.showAll=true; refresh();
    const el=document.getElementById("in_"+id)||document.querySelector(`[data-wrap="${id}"] button`); if(el){el.scrollIntoView({block:"center",behavior:"smooth"}); setTimeout(()=>el.focus({preventScroll:true}),300);} });
  mod.querySelectorAll("[data-rq]").forEach(a=>a.onclick=()=>{ close(); const el=document.getElementById("rq_"+a.dataset.rq); el.scrollIntoView({block:"center",behavior:"smooth"}); setTimeout(()=>el.focus({preventScroll:true}),300); });
};

const xmlEsc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
function serial(iso){ const [y,m,d]=iso.split("-").map(Number); return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5; }
function putCell(xml,ref,val,kind){
  const re=new RegExp(`<c r="${ref}"((?: [a-z]+="[^"]*")*?)(?: t="[^"]*")?((?: [a-z]+="[^"]*")*)\\s*(?:/>|>[\\s\\S]*?</c>)`);
  return xml.replace(re,(m,a1,a2)=>{
    const attrs=(a1+a2).replace(/ t="[^"]*"/g,"");
    if(kind==="num") return `<c r="${ref}"${attrs}><v>${val}</v></c>`;
    return `<c r="${ref}"${attrs} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`;
  });
}
function b64bytes(b){ const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function build(){
  try{
    const zip=await JSZip.loadAsync(await (await fetch("template.xlsx",{cache:"no-cache"})).arrayBuffer());
    const path="xl/worksheets/sheet1.xml";
    let x=await zip.file(path).async("string");
    CFG.req.forEach(q=>{ const v=S.req[q.id]; if(isEmpty(v)) return;
      if(q.id==="date"||q.id==="deadline") x=putCell(x,q.cell,serial(v),"num"); else x=putCell(x,q.cell,v.trim(),"str"); });
    S.skus.forEach((s,i)=>{ const col=SKUCOLS[i];
      CFG.fields.forEach(f=>{ const v=s[f.id]; if(isEmpty(v)) return;
        const t=String(v).trim();
        if((f.chk==="int"||f.chk==="dec")&&!isNaN(toNum(t))) x=putCell(x,col+f.row,toNum(t),"num");
        else x=putCell(x,col+f.row,t,"str"); }); });
    if(S.skus.length>5) x=x.replace(/<col hidden="1" outlineLevel="1"/,'<col outlineLevel="1"');
    zip.file(path,x);
    const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const art=(S.skus[0].D||"товар").trim().replace(/[\\/:*?"<>|]+/g,"_").slice(0,40);
    const d=new Date(), ds=[d.getDate(),d.getMonth()+1].map(n=>String(n).padStart(2,"0")).join(".")+"."+String(d.getFullYear()).slice(2);
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`БРИФ_КТ_${art}_${ds}.xlsx`;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
    toast("Бриф скачан. Отправьте файл менеджеру по сопровождению");
  }catch(err){ console.error(err); toast("Не удалось собрать файл Excel"); }
}

/* ---------- открыть ранее скачанный бриф ---------- */
$("#bOpen").onclick=()=>$("#fOpen").click();
$("#fOpen").onchange=async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{
    const zip=await JSZip.loadAsync(file);
    const wbx=await zip.file("xl/workbook.xml").async("string");
    const rels=await zip.file("xl/_rels/workbook.xml.rels").async("string");
    const P=new DOMParser();
    const wbd=P.parseFromString(wbx,"application/xml"), rd=P.parseFromString(rels,"application/xml");
    const sh=[...wbd.getElementsByTagName("sheet")].find(n=>n.getAttribute("name")==="Бриф")||wbd.getElementsByTagName("sheet")[0];
    const rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    let target=[...rd.getElementsByTagName("Relationship")].find(n=>n.getAttribute("Id")===rid).getAttribute("Target");
    target=target.replace(/^\/?xl\//,"").replace(/^\//,""); const sp="xl/"+target;
    let shared=[]; const ssf=zip.file("xl/sharedStrings.xml");
    if(ssf){ const sd=P.parseFromString(await ssf.async("string"),"application/xml"); shared=[...sd.getElementsByTagName("si")].map(si=>[...si.getElementsByTagName("t")].map(t=>t.textContent).join("")); }
    const doc=P.parseFromString(await zip.file(sp).async("string"),"application/xml");
    const cells={};
    [...doc.getElementsByTagName("c")].forEach(c=>{ const r=c.getAttribute("r"), t=c.getAttribute("t");
      let v=null; if(t==="inlineStr") v=[...c.getElementsByTagName("t")].map(n=>n.textContent).join("");
      else { const vn=c.getElementsByTagName("v")[0]; if(vn){ v=vn.textContent; if(t==="s") v=shared[+v]; } }
      if(v!=null&&v!=="") cells[r]=v; });
    const fromSerial=n=>{ const d=new Date(Date.UTC(1899,11,30)+Math.round(+n)*864e5); return d.toISOString().slice(0,10); };
    const req={}; CFG.req.forEach(q=>{ const v=cells[q.cell]; if(v!=null) req[q.id]=(q.id==="date"||q.id==="deadline")&&/^\d+(\.\d+)?$/.test(v)?fromSerial(v):String(v); });
    const skus=[];
    SKUCOLS.forEach(col=>{ const s={}; let any=false;
      CFG.fields.forEach(f=>{ const v=cells[col+f.row]; if(v!=null){ any=true; s[f.id]=(f.chk==="dec")?String(+(+v).toFixed(3)).replace(".",","):String(v);} });
      if(any) skus.push(s); });
    if(!skus.length&&!Object.keys(req).length) throw new Error("empty");
    S={req:Object.assign({date:todayISO()},req),skus:skus.length?skus:[{}],cur:0,touched:{}};
    renderAll(); window.scrollTo(0,0);
    toast(`Бриф открыт: ${S.skus.length} SKU. Не забудьте заполнить «Корректировку данных»`);
  }catch(err){ console.error(err); toast("Не удалось прочитать файл — нужен бриф, скачанный из этой формы или по шаблону"); }
};
$("#bClear").onclick=()=>ask("Очистить форму?","Все введённые данные будут удалены. Если они нужны, сначала скачайте Excel.","Очистить",()=>{ S=blank(); renderAll(); window.scrollTo(0,0); });

renderAll();
})();
